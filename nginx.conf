server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(jpg|jpeg|png|svg|css|js)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
